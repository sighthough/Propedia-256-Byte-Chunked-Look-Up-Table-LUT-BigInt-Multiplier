<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Pure Software BigInt Multiplication Benchmark</title>
  <style>
    body { font-family: monospace; background: #0f172a; color: #f8fafc; max-width: 900px; margin: 2rem auto; padding: 1rem; }
    h1 { color: #38bdf8; text-align: center; margin-bottom: 0.2rem; }
    p.subtitle { text-align: center; color: #94a3b8; margin-bottom: 1.5rem; }
    .card { background: #1e293b; padding: 1.5rem; border-radius: 8px; margin-bottom: 1rem; border: 1px solid #334155; }
    .controls { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem; margin-bottom: 1rem; }
    label { display: block; margin-bottom: 0.5rem; color: #94a3b8; }
    select, button { width: 100%; padding: 0.6rem; background: #0f172a; color: #fff; border: 1px solid #475569; border-radius: 4px; font-family: inherit; }
    button { background: #2563eb; border: none; font-weight: bold; cursor: pointer; }
    button:hover { background: #1d4ed8; }
    button:disabled { background: #475569; cursor: not-allowed; }
    table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
    th, td { padding: 0.75rem; border-bottom: 1px solid #334155; text-align: left; }
    th { color: #38bdf8; }
    .status { padding: 0.5rem; background: #064e3b; color: #34d399; border-radius: 4px; display: none; margin-bottom: 1rem; }
    .annotation { background: #0284c715; border-left: 4px solid #38bdf8; padding: 0.75rem; margin-top: 1rem; font-size: 0.85rem; color: #cbd5e1; }
  </style>
</head>
<body>

  <h1>Software-Emulated Multiplication Benchmark</h1>
  <p class="subtitle">Apples-to-Apples Software Comparison on identical JS Execution Level</p>

  <div class="card controls">
    <div>
      <label>Number Size:</label>
      <select id="bitSize">
        <option value="128">128-Bit</option>
        <option value="256" selected>256-Bit</option>
        <option value="512">512-Bit</option>
      </select>
    </div>
    <div>
      <label>Operations:</label>
      <select id="iterations">
        <option value="500">500 Ops</option>
        <option value="2000" selected>2,000 Ops</option>
        <option value="5000">5,000 Ops</option>
      </select>
    </div>
    <div>
      <label>&nbsp;</label>
      <button id="runBtn" onclick="startBenchmark()">Run Benchmark</button>
    </div>
  </div>

  <div id="status" class="status">✓ Math Verification Passed: All software engines produced 100% identical results!</div>

  <div class="card">
    <table>
      <thead>
        <tr>
          <th>Software Algorithm</th>
          <th>Total Time</th>
          <th>Throughput</th>
          <th>Relative Speed</th>
        </tr>
      </thead>
      <tbody id="results">
        <tr><td colspan="4" style="text-align:center; color:#94a3b8;">Click "Run Benchmark" to execute.</td></tr>
      </tbody>
    </table>
  </div>

  <script>
    /* =========================================================================
       >>> COPY START: STANDALONE PROPEDIA 256 MULTIPLIER ENGINE <<<
       
       Usage in any project:
         const engine = new Propedia256();
         const result = engine.multiply(bigIntA, bigIntB);
       ========================================================================= */
    class Propedia256 {
      constructor() {
        // Precompute 256x256 lookup table (65,536 entries, 128 KB memory)
        this.lut = new Uint16Array(256 * 256);
        for (let a = 0; a < 256; a++) {
          for (let b = 0; b < 256; b++) {
            this.lut[(a << 8) | b] = a * b;
          }
        }
      }

      // Decomposes BigInt into 8-bit byte chunks (Little-Endian)
      toChunks(num) {
        if (num === 0n) return new Uint8Array([0]);
        const chunks = [];
        let temp = num < 0n ? -num : num;
        while (temp > 0n) {
          chunks.push(Number(temp & 0xFFn));
          temp >>= 8n;
        }
        return new Uint8Array(chunks);
      }

      // Multiplies chunks using 8-bit Propedia table lookups
      multiplyChunks(chunksA, chunksB) {
        const lenA = chunksA.length;
        const lenB = chunksB.length;
        const result = new Uint32Array(lenA + lenB);

        for (let i = 0; i < lenA; i++) {
          const offsetA = chunksA[i] << 8;
          for (let j = 0; j < lenB; j++) {
            result[i + j] += this.lut[offsetA | chunksB[j]];
          }
        }

        // Ripple carry propagation
        let carry = 0;
        for (let k = 0; k < result.length; k++) {
          const total = result[k] + carry;
          result[k] = total & 0xFF;
          carry = total >> 8;
        }

        return result;
      }

      // Reconstructs BigInt from 8-bit result chunks
      chunksToBigInt(chunks) {
        let res = 0n;
        for (let i = chunks.length - 1; i >= 0; i--) {
          res = (res << 8n) | BigInt(chunks[i]);
        }
        return res;
      }

      // Main Public API
      multiply(a, b) {
        if (a === 0n || b === 0n) return 0n;
        const sign = (a < 0n) !== (b < 0n) ? -1n : 1n;
        const resChunks = this.multiplyChunks(this.toChunks(a), this.toChunks(b));
        return sign * this.chunksToBigInt(resChunks);
      }
    }
    /* =========================================================================
       <<< COPY END: STANDALONE PROPEDIA 256 MULTIPLIER ENGINE >>>
       ========================================================================= */

    /* -------------------------------------------------------------------------
       BENCHMARK ENGINES FOR EQUAL SOFTWARE COMPARISON
       ------------------------------------------------------------------------- */

    // Engine 2: Pure Software Base-16 (4-bit Nibble Chunking + 16x16 LUT)
    class Propedia16 {
      constructor() {
        this.lut = new Uint8Array(16 * 16);
        for (let a = 0; a < 16; a++) {
          for (let b = 0; b < 16; b++) {
            this.lut[(a << 4) | b] = a * b;
          }
        }
      }

      toChunks(num) {
        if (num === 0n) return new Uint8Array([0]);
        const chunks = [];
        let temp = num < 0n ? -num : num;
        while (temp > 0n) {
          chunks.push(Number(temp & 0xFn));
          temp >>= 4n;
        }
        return new Uint8Array(chunks);
      }

      multiply(a, b) {
        if (a === 0n || b === 0n) return 0n;
        const chunksA = this.toChunks(a);
        const chunksB = this.toChunks(b);
        const result = new Uint32Array(chunksA.length + chunksB.length);

        for (let i = 0; i < chunksA.length; i++) {
          const offsetA = chunksA[i] << 4;
          for (let j = 0; j < chunksB.length; j++) {
            result[i + j] += this.lut[offsetA | chunksB[j]];
          }
        }

        let carry = 0;
        for (let k = 0; k < result.length; k++) {
          const total = result[k] + carry;
          result[k] = total & 0xF;
          carry = total >> 4;
        }

        let res = 0n;
        for (let i = result.length - 1; i >= 0; i--) {
          res = (res << 4n) | BigInt(result[i]);
        }
        return res;
      }
    }

    // Engine 3: Pure Software 1-Bit Shift-and-Add Loop
    function multiply1BitSoftware(a, b) {
      if (a === 0n || b === 0n) return 0n;
      let res = 0n, tempA = a, tempB = b;
      while (tempB > 0n) {
        if (tempB & 1n) res += tempA;
        tempA <<= 1n;
        tempB >>= 1n;
      }
      return res;
    }

    // Benchmark Suite Execution
    const prop256 = new Propedia256();
    const prop16 = new Propedia16();

    function generateRandomBigInt(bits) {
      let hex = '0x';
      const hexChars = '0123456789abcdef';
      for (let i = 0; i < bits / 4; i++) {
        hex += hexChars[Math.floor(Math.random() * 16)];
      }
      return BigInt(hex);
    }

    function startBenchmark() {
      const btn = document.getElementById('runBtn');
      btn.disabled = true;
      btn.innerText = 'Benchmarking...';
      setTimeout(runBenchmark, 50);
    }

    function runBenchmark() {
      const btn = document.getElementById('runBtn');
      const bitSize = parseInt(document.getElementById('bitSize').value);
      const iterations = parseInt(document.getElementById('iterations').value);

      const pairsA = [];
      const pairsB = [];
      for (let i = 0; i < iterations; i++) {
        pairsA.push(generateRandomBigInt(bitSize));
        pairsB.push(generateRandomBigInt(bitSize));
      }

      // Correctness Verification
      for (let i = 0; i < 10; i++) {
        const expected = pairsA[i] * pairsB[i];
        const r256 = prop256.multiply(pairsA[i], pairsB[i]);
        const r16 = prop16.multiply(pairsA[i], pairsB[i]);
        const r1 = multiply1BitSoftware(pairsA[i], pairsB[i]);

        if (r256 !== expected || r16 !== expected || r1 !== expected) {
          alert('Math Verification Failed!');
          btn.disabled = false;
          btn.innerText = 'Run Benchmark';
          return;
        }
      }

      document.getElementById('status').style.display = 'block';

      // 1. Run Propedia 256 (8-Bit Chunking)
      const t0 = performance.now();
      for (let i = 0; i < iterations; i++) prop256.multiply(pairsA[i], pairsB[i]);
      const d256 = performance.now() - t0;

      // 2. Run Propedia 16 (4-Bit Chunking)
      const t1 = performance.now();
      for (let i = 0; i < iterations; i++) prop16.multiply(pairsA[i], pairsB[i]);
      const d16 = performance.now() - t1;

      // 3. Run 1-Bit Shift-and-Add Software
      const t2 = performance.now();
      for (let i = 0; i < iterations; i++) multiply1BitSoftware(pairsA[i], pairsB[i]);
      const d1 = performance.now() - t2;

      // Render Results
      const resultsHtml = `
        <tr>
          <td><strong>Propedia 256</strong> (8-Bit / 256x256 LUT)</td>
          <td>${d256.toFixed(1)} ms</td>
          <td>${Math.round((iterations / d256) * 1000).toLocaleString()} ops/sec</td>
          <td><strong style="color:#34d399">Baseline (1.0x - Fastest)</strong></td>
        </tr>
        <tr>
          <td><strong>Propedia 16</strong> (4-Bit / 16x16 LUT)</td>
          <td>${d16.toFixed(1)} ms</td>
          <td>${Math.round((iterations / d16) * 1000).toLocaleString()} ops/sec</td>
          <td>${(d16 / d256).toFixed(1)}x slower</td>
        </tr>
        <tr>
          <td><strong>Shift-and-Add</strong> (1-Bit Software Loop)</td>
          <td>${d1.toFixed(1)} ms</td>
          <td>${Math.round((iterations / d1) * 1000).toLocaleString()} ops/sec</td>
          <td>${(d1 / d256).toFixed(1)}x slower</td>
        </tr>
      `;

      document.getElementById('results').innerHTML = resultsHtml;
      btn.disabled = false;
      btn.innerText = 'Run Benchmark';
    }
  </script>
</body>
</html>
